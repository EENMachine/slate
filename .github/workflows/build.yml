name: Build Slate (macOS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild on macos-latest
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild \
            -project Slate.xcodeproj \
            -scheme Slate \
            -destination 'platform=macOS' \
            -resolvePackageDependencies

      - name: Build (Debug, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Slate.xcodeproj \
            -scheme Slate \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build | tee xcodebuild-build.log | xcpretty || (tail -200 xcodebuild-build.log && exit 1)

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Slate.xcodeproj \
            -scheme Slate \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            test | tee xcodebuild-test.log | xcpretty || (tail -300 xcodebuild-test.log && exit 1)

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: xcodebuild-*.log
          retention-days: 7
